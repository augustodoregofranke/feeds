name: Build feeds

on:
  schedule:
    - cron: "0 9 * * *"   # daily, 06:00 in Brazil
  workflow_dispatch:       # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build job feed
        run: python3 jobs_feed.py --report
      - name: Save first-seen dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git push
      - name: Prepare site
        run: |
          mkdir -p _site
          cp jobs.xml _site/
          echo "feeds.augustodoregofranke.com" > _site/CNAME
          printf '<!doctype html><meta charset="utf-8"><title>Feeds</title><ul><li><a href="jobs.xml">jobs.xml</a></li></ul>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
